[project]
name = "godot-zero"
version = "0.1.0"
description = "Russian-language documentation for the Godot engine and GDScript"
requires-python = ">=3.14"
dependencies = [
    "sphinx>=8.0",
    "sphinx-design>=0.6.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "sphinx-autobuild>=2024.10.3",
    "sphinx-lint>=1.0.0",
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
    "pytest-sugar>=1.0",
    "ruff>=0.8",
    "gdtoolkit>=4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--tb=short", "-ra", "--no-header"]

[tool.ruff]
line-length = 120
src = ["source/_ext", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["godot_zero", "godot_pygments", "conftest"]
