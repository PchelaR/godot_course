server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/godot-zero;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /_static/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location /_static/godot/ {
        add_header Cache-Control "no-cache";
    }

    location /_images/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
